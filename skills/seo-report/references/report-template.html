<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
  :root { --bg:#ffffff; --fg:#1b1f24; --muted:#5b6570; --line:#d9dee4; --accent:#0b5cad; --warn:#9a4b00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171a; --fg:#e6e9ec; --muted:#9aa5b1; --line:#2c333a; --accent:#6db3ff; --warn:#ffb067; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  h2 { font-size: 1.15rem; margin: 32px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  table { width: 100%; border-collapse: collapse; margin: 8px 0 16px; font-size: .95rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  td.src { color: var(--muted); font-size: .85rem; word-break: break-word; }
  .table-wrap { overflow-x: auto; }
  ul { padding-left: 1.2rem; }
  .note { color: var(--warn); }
  footer { margin-top: 40px; color: var(--muted); font-size: .85rem; }
  @media print { body { background: #fff; color: #000; } }
</style>
</head>
<body>
<main>
  <h1>{{title}}</h1>
  <p class="sub">{{subtitle}}</p>
  {{body}}
  <footer>{{footer}}</footer>
</main>
</body>
</html>
